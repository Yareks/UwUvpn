# Move to .github/workflows/build-apk.yml to enable automatic GitHub Actions APK builds
name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK r27c
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018 & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.2.12479018"

      - name: Install Rust & cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build native Rust engines & release APK
        env:
          VELOX_KS_PASS: ${{ secrets.VELOX_KS_PASS }}
          VELOX_KEY_ALIAS: ${{ secrets.VELOX_KEY_ALIAS }}
          VELOX_KEY_PASS: ${{ secrets.VELOX_KEY_PASS }}
        run: |
          chmod +x scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UwUvpn-VeloxVPN-release-apk
          path: android/app/build/outputs/apk/release/*.apk
